<!-- productos/templates/productos/form.html -->
{% extends "core/base.html" %}
{% block title %}{% if object %}Editar{% else %}Crear{% endif %} Producto{% endblock %}

{% block content %}
<h2>{% if object %}Editar{% else %}Crear{% endif %} Producto</h2>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Guardar</button>
  <a href="{% url 'productos:lista' %}">Cancelar</a>
</form>
{% endblock %}
